openapi: 3.0.3
info:
  title: MySawit Plantation Service API
  description: |
    REST API for managing oil palm plantations (Kebun Sawit).

    ## Features
    - CRUD operations for plantations
    - Assign and transfer mandor (foreman) to plantations
    - Geo-spatial validation: coordinates must form a square, must lie within
      real-world latitude/longitude ranges, and must not overlap with existing
      plantations
    - Admin role-based access control

    ## Authentication
    All `/api/plantations/**` endpoints require a JWT Bearer token whose
    `role` claim is `ADMIN`.

    ## Error response format
    All errors handled by the application return a uniform body:

    ```json
    { "error": "<human readable message>" }
    ```

    There is no separate `message` field. The HTTP status code carries the
    error category; the `error` value carries the specific reason.
  version: 1.1.0
  contact:
    name: MySawit Development Team

servers:
  - url: http://localhost:8082
    description: Local development server
  - url: "{baseUrl}"
    description: Production server (override via APP_BASE_URL)
    variables:
      baseUrl:
        default: https://api.mysawit.com
        description: Public base URL of the deployed service

tags:
  - name: Plantations
    description: Plantation CRUD and geometry operations
  - name: Mandor
    description: Mandor (foreman) assignment and transfer operations

paths:
  /api/plantations:
    get:
      tags:
        - Plantations
      summary: List all plantations
      description: Retrieve every plantation visible to the caller. Requires `ADMIN` role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Plantations
      summary: Create a new plantation
      description: |
        Create a new plantation. The four supplied coordinates must:
        - Each lie within latitude `[-90, 90]` and longitude `[-180, 180]`
        - Form a non-degenerate square
        - Not overlap with any existing plantation polygon

        Bean Validation (`@Valid`) on the request body enforces the per-field
        and range constraints; the geometry/overlap checks run in the service
        layer.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlantationRequest"
            examples:
              minimal:
                summary: Minimal example
                value:
                  name: "Kebun Sawit Baru"
                  location: "Sumatera Utara"
                  area: 75.0
                  coordinates:
                    - latitude: 1.5
                      longitude: 101.0
                    - latitude: 1.5
                      longitude: 101.1
                    - latitude: 1.6
                      longitude: 101.1
                    - latitude: 1.6
                      longitude: 101.0
              full:
                summary: Full example with all optional fields
                value:
                  name: "Kebun Sawit Indah"
                  location: "Riau, Indonesia"
                  area: 50.5
                  description: "Main plantation area"
                  ownerId: "owner-uuid-123"
                  plantDate: "2025-01-15T00:00:00"
                  coordinates:
                    - latitude: 1.234
                      longitude: 101.567
                    - latitude: 1.234
                      longitude: 101.589
                    - latitude: 1.256
                      longitude: 101.589
                    - latitude: 1.256
                      longitude: 101.567
      responses:
        "201":
          description: Plantation created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantationResponse"
        "400":
          description: |
            Bad request. Triggered by any of:
            - Bean Validation failure (missing/blank field, non-positive area,
              wrong coordinate count, latitude/longitude out of world range)
            - `InvalidGeometryException`: coordinates do not form a valid
              square or are outside the world range
            - `OverlappingPlantationException`: coordinates overlap an
              existing plantation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                latitude-out-of-range:
                  summary: Latitude outside [-90, 90]
                  value:
                    error: "Latitude must be between -90 and 90"
                longitude-out-of-range:
                  summary: Longitude outside [-180, 180]
                  value:
                    error: "Longitude must be between -180 and 180"
                not-a-square:
                  summary: Coordinates do not form a valid square
                  value:
                    error: "The provided coordinates do not form a valid square"
                overlapping:
                  summary: Overlap with an existing plantation
                  value:
                    error: "Plantation overlaps with existing plantation ID: 42"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/plantations/{id}:
    get:
      tags:
        - Plantations
      summary: Get plantation by ID
      description: Retrieve a specific plantation by its database ID. Requires `ADMIN` role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlantationId"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Plantations
      summary: Update plantation
      description: |
        Update an existing plantation's mutable fields (`name`, `location`,
        `area`, `description`, `plantDate`, `coordinates`). The plantation
        `code` and `ownerId` are immutable through this endpoint.

        Coordinate validation rules match those of `POST /api/plantations`,
        except overlap detection automatically excludes the plantation being
        updated, so an unchanged polygon is never reported as self-overlap.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlantationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlantationRequest"
      responses:
        "200":
          description: Plantation updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantationResponse"
        "400":
          description: |
            Bad request. Same conditions as `POST /api/plantations` (bean
            validation, invalid geometry, overlap with another plantation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Plantations
      summary: Delete plantation
      description: |
        Delete a plantation. The deletion is rejected when the plantation
        currently has a mandor assigned — unassign or transfer the mandor
        first. Requires `ADMIN` role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlantationId"
      responses:
        "204":
          description: Plantation deleted successfully
        "400":
          description: Cannot delete because a mandor is still assigned to this plantation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Cannot delete plantation with ID 1 as it has an assigned mandor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plantations/owner/{ownerId}:
    get:
      tags:
        - Plantations
      summary: List plantations by owner
      description: Retrieve all plantations associated with the given `ownerId`. Requires `ADMIN` role.
      security:
        - bearerAuth: []
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner user identifier
          schema:
            type: string
          example: "owner-uuid-123"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/plantations/{id}/mandor:
    post:
      tags:
        - Mandor
      summary: Assign a mandor to a plantation
      description: |
        Assign a mandor (foreman) to the given plantation. A mandor can only
        be assigned to one plantation at a time — assigning a mandor that is
        already assigned elsewhere is rejected. Requires `ADMIN` role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlantationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMandorRequest"
            example:
              mandorId: "mandor-uuid-456"
      responses:
        "200":
          description: Mandor assigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantationResponse"
        "400":
          description: Mandor is already assigned to another plantation, or `mandorId` is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Mandor with ID mandor-uuid-456 is already assigned to plantation ID 7"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plantations/transfer-mandor:
    put:
      tags:
        - Mandor
      summary: Transfer a mandor between plantations
      description: |
        Move a mandor from one plantation to another. The transfer is
        rejected if the mandor is not currently assigned to the source
        plantation, or if the target plantation already has a mandor.
        Requires `ADMIN` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferMandorRequest"
            example:
              mandorId: "mandor-uuid-456"
              fromPlantationId: 1
              toPlantationId: 2
      responses:
        "200":
          description: Mandor transferred successfully
        "400":
          description: |
            Transfer validation error: source mismatch or target already has
            a mandor assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                mandor-not-assigned:
                  summary: Mandor not assigned to the source plantation
                  value:
                    error: "Mandor with ID mandor-uuid-456 is not assigned to plantation ID 1"
                target-has-mandor:
                  summary: Target plantation already has a mandor
                  value:
                    error: "Target plantation with ID 2 already has a mandor assigned"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token. The token's `role` claim must equal `ADMIN`.
        Tokens are signed with the service's HMAC secret (`jwt.secret`).

  parameters:
    PlantationId:
      name: id
      in: path
      required: true
      description: Plantation database identifier
      schema:
        type: integer
        format: int64
      example: 1

  schemas:
    Coordinate:
      type: object
      description: |
        Geographic coordinate of a single corner of a plantation polygon.
        Both fields are required and must lie within real-world ranges.
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude in degrees, between -90 and 90 inclusive.
          example: 1.234
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude in degrees, between -180 and 180 inclusive.
          example: 101.567

    BasePlantationFields:
      type: object
      description: Fields shared between create and update plantation requests.
      required:
        - name
        - location
        - area
        - coordinates
      properties:
        name:
          type: string
          minLength: 1
          description: Plantation name. Must be non-blank.
          example: "Kebun Sawit Indah"
        location:
          type: string
          minLength: 1
          description: Free-form plantation location. Must be non-blank.
          example: "Riau, Indonesia"
        area:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Plantation area. Must be strictly positive (`@Positive`).
          example: 50.5
        description:
          type: string
          nullable: true
          description: |
            Optional plantation description. Persisted column is limited to
            1000 characters; longer values may be rejected at the database
            layer.
          example: "Main plantation area"
        plantDate:
          type: string
          format: date-time
          nullable: true
          description: Optional planting date in ISO 8601 format.
          example: "2025-01-15T00:00:00"
        coordinates:
          type: array
          description: Exactly four coordinates forming a square boundary.
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/Coordinate"

    CreatePlantationRequest:
      allOf:
        - $ref: "#/components/schemas/BasePlantationFields"
        - type: object
          description: Request body for creating a new plantation.
          properties:
            ownerId:
              type: string
              nullable: true
              description: |
                Optional owner user ID. Set on creation; cannot be modified
                via the update endpoint.
              example: "owner-uuid-123"

    UpdatePlantationRequest:
      allOf:
        - $ref: "#/components/schemas/BasePlantationFields"
        - type: object
          description: |
            Request body for updating a plantation. The plantation `code` and
            `ownerId` are not exposed here and remain immutable.

    PlantationResponse:
      type: object
      description: Plantation resource returned by the API.
      properties:
        id:
          type: integer
          format: int64
          description: Unique plantation identifier.
          example: 1
        code:
          type: string
          description: Auto-generated unique plantation code (`PLT-XXXXXXXX`).
          example: "PLT-A1B2C3D4"
        name:
          type: string
          example: "Kebun Sawit Indah"
        location:
          type: string
          example: "Riau, Indonesia"
        area:
          type: number
          format: double
          example: 50.5
        description:
          type: string
          nullable: true
          example: "Main plantation area"
        ownerId:
          type: string
          nullable: true
          description: Owner user ID. Null when not assigned.
          example: "owner-uuid-123"
        mandorId:
          type: string
          nullable: true
          description: Currently assigned mandor ID. Null when no mandor is assigned.
          example: "mandor-uuid-456"
        plantDate:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-15T00:00:00"
        coordinates:
          type: array
          description: The four-corner polygon describing the plantation.
          items:
            $ref: "#/components/schemas/Coordinate"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the plantation row was created.
          example: "2026-02-20T10:00:00"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update.
          example: "2026-02-20T10:00:00"

    AssignMandorRequest:
      type: object
      description: Request body for assigning a mandor to a plantation.
      required:
        - mandorId
      properties:
        mandorId:
          type: string
          minLength: 1
          description: Mandor (foreman) ID to assign. Must be non-blank.
          example: "mandor-uuid-456"

    TransferMandorRequest:
      type: object
      description: Request body for transferring a mandor between plantations.
      required:
        - mandorId
        - fromPlantationId
        - toPlantationId
      properties:
        mandorId:
          type: string
          minLength: 1
          description: Mandor ID to transfer.
          example: "mandor-uuid-456"
        fromPlantationId:
          type: integer
          format: int64
          description: Source plantation ID.
          example: 1
        toPlantationId:
          type: integer
          format: int64
          description: Target plantation ID.
          example: 2

    ErrorResponse:
      type: object
      description: |
        Uniform error body produced by the application's
        `GlobalExceptionHandler`. Contains a single human-readable `error`
        field; the HTTP status code provides the error category.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable failure reason.
          example: "Plantation not found with id: 99"

  responses:
    Unauthorized:
      description: Missing, invalid, or expired JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Authentication required"

    Forbidden:
      description: Authenticated, but the JWT does not carry the `ADMIN` role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Access denied. ADMIN role required."

    NotFound:
      description: Requested plantation does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Plantation not found with id: 1"
