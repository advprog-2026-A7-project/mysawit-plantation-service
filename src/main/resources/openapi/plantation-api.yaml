openapi: 3.0.3
info:
  title: MySawit Plantation Service API
  description: |
    REST API for managing oil palm plantations (Kebun Sawit).

    ## Features
    - CRUD operations for plantations
    - Assign and transfer mandor (foreman) to plantations
    - Geo-spatial validation for plantation coordinates
    - Admin role-based access control

    ## Authentication
    All endpoints require JWT Bearer token authentication with ADMIN role.
  version: 1.0.0
  contact:
    name: MySawit Development Team

servers:
  - url: http://localhost:8082
    description: Development server
  - url: ${APP_BASE_URL:https://api.mysawit.com}
    description: Production server

tags:
  - name: Plantations
    description: Plantation management operations

paths:
  /api/plantations:
    get:
      tags:
        - Plantations
      summary: Get all plantations
      description: Retrieve all plantations (requires ADMIN role)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Plantations
      summary: Create a new plantation
      description: |
        Create a new plantation with geo-spatial coordinates.
        Coordinates must form a square shape and must not overlap with existing plantations.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlantationRequest"
            examples:
              minimal:
                summary: Minimal example
                value:
                  name: "Kebun Sawit Baru"
                  location: "Sumatera Utara"
                  area: 75.0
                  coordinates:
                    - latitude: 1.5
                      longitude: 101.0
                    - latitude: 1.5
                      longitude: 101.1
                    - latitude: 1.6
                      longitude: 101.1
                    - latitude: 1.6
                      longitude: 101.0
              full:
                summary: Full example with all fields
                value:
                  name: "Kebun Sawit Indah"
                  location: "Riau, Indonesia"
                  area: 50.5
                  description: "Main plantation area"
                  ownerId: "owner-uuid-123"
                  plantDate: "2025-01-15T00:00:00"
                  coordinates:
                    - latitude: 1.234
                      longitude: 101.567
                    - latitude: 1.234
                      longitude: 101.589
                    - latitude: 1.256
                      longitude: 101.589
                    - latitude: 1.256
                      longitude: 101.567
      responses:
        "201":
          description: Plantation created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Overlapping plantation or invalid geometry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/plantations/{id}:
    get:
      tags:
        - Plantations
      summary: Get plantation by ID
      description: Retrieve a specific plantation by its ID (requires ADMIN role)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Plantation ID
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Plantations
      summary: Update plantation
      description: |
        Update an existing plantation.
        Coordinates must form a square and must not overlap with other plantations.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Plantation ID
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlantationRequest"
      responses:
        "200":
          description: Plantation updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Plantations
      summary: Delete plantation
      description: |
        Delete a plantation. Only allowed if no mandor is assigned to this plantation.
        Requires ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Plantation ID
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "204":
          description: Plantation deleted successfully
        "400":
          description: Cannot delete - mandor assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                mandor-assigned:
                  summary: Mandor assigned error
                  value:
                    error: "Bad Request"
                    message: "Cannot delete plantation with ID 1 as it has an assigned mandor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plantations/owner/{ownerId}:
    get:
      tags:
        - Plantations
      summary: Get plantations by owner
      description: Retrieve all plantations owned by a specific user (requires ADMIN role)
      security:
        - bearerAuth: []
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner user ID
          schema:
            type: string
          example: "owner-uuid-123"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/plantations/{id}/mandor:
    post:
      tags:
        - Plantations
      summary: Assign mandor to plantation
      description: |
        Assign a mandor (foreman) to a plantation.
        A mandor can only be assigned to one plantation at a time.
        Requires ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Plantation ID
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMandorRequest"
            example:
              mandorId: "mandor-uuid-456"
      responses:
        "200":
          description: Mandor assigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantationResponse"
        "400":
          description: Mandor already assigned to another plantation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plantations/transfer-mandor:
    put:
      tags:
        - Plantations
      summary: Transfer mandor between plantations
      description: |
        Transfer a mandor from one plantation to another.
        The target plantation must not have an existing mandor.
        Requires ADMIN role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferMandorRequest"
            example:
              mandorId: "mandor-uuid-456"
              fromPlantationId: 1
              toPlantationId: 2
      responses:
        "200":
          description: Mandor transferred successfully
        "400":
          description: Transfer validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                mandor-not-assigned:
                  summary: Mandor not assigned to source
                  value:
                    error: "Bad Request"
                    message: "Mandor with ID mandor-uuid-456 is not assigned to plantation ID 1"
                target-has-mandor:
                  summary: Target has mandor
                  value:
                    error: "Bad Request"
                    message: "Target plantation with ID 2 already has a mandor assigned"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token with ADMIN role required for all endpoints

  schemas:
    Coordinate:
      type: object
      description: Geographic coordinate for plantation boundary
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          description: Latitude coordinate
          example: 1.234
        longitude:
          type: number
          format: double
          description: Longitude coordinate
          example: 101.567

    CreatePlantationRequest:
      type: object
      description: Request body for creating a new plantation
      required:
        - name
        - location
        - area
        - coordinates
      properties:
        name:
          type: string
          description: Plantation name
          minLength: 1
          maxLength: 255
          example: "Kebun Sawit Indah"
        location:
          type: string
          description: Plantation location
          minLength: 1
          maxLength: 500
          example: "Riau, Indonesia"
        area:
          type: number
          format: double
          description: Plantation area (must be positive)
          minimum: 0.001
          example: 50.5
        description:
          type: string
          description: Plantation description
          maxLength: 1000
          example: "Main plantation area"
        ownerId:
          type: string
          description: Owner user ID (optional)
          example: "owner-uuid-123"
        plantDate:
          type: string
          format: date-time
          description: Planting date (ISO 8601 format)
          example: "2025-01-15T00:00:00"
        coordinates:
          type: array
          description: List of 4 coordinates forming a square boundary
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/Coordinate"

    UpdatePlantationRequest:
      type: object
      description: Request body for updating a plantation
      required:
        - name
        - location
        - area
        - coordinates
      properties:
        name:
          type: string
          description: Plantation name
          minLength: 1
          maxLength: 255
        location:
          type: string
          description: Plantation location
          minLength: 1
          maxLength: 500
        area:
          type: number
          format: double
          description: Plantation area (must be positive)
          minimum: 0.001
        description:
          type: string
          description: Plantation description
          maxLength: 1000
        plantDate:
          type: string
          format: date-time
          description: Planting date (ISO 8601 format)
        coordinates:
          type: array
          description: List of 4 coordinates forming a square boundary
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/Coordinate"

    PlantationResponse:
      type: object
      description: Plantation response object
      properties:
        id:
          type: integer
          format: int64
          description: Unique plantation identifier
          example: 1
        code:
          type: string
          description: Auto-generated unique plantation code
          example: "PLT-A1B2C3D4"
        name:
          type: string
          description: Plantation name
          example: "Kebun Sawit Indah"
        location:
          type: string
          description: Plantation location
          example: "Riau, Indonesia"
        area:
          type: number
          format: double
          description: Plantation area
          example: 50.5
        description:
          type: string
          description: Plantation description
          example: "Main plantation area"
        ownerId:
          type: string
          description: Owner user ID
          nullable: true
          example: "owner-uuid-123"
        mandorId:
          type: string
          description: Assigned mandor ID (if any)
          nullable: true
          example: "mandor-uuid-456"
        plantDate:
          type: string
          format: date-time
          description: Planting date
          example: "2025-01-15T00:00:00"
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2026-02-20T10:00:00"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2026-02-20T10:00:00"

    AssignMandorRequest:
      type: object
      description: Request body for assigning a mandor to a plantation
      required:
        - mandorId
      properties:
        mandorId:
          type: string
          description: Mandor (foreman) ID to assign
          example: "mandor-uuid-456"

    TransferMandorRequest:
      type: object
      description: Request body for transferring a mandor between plantations
      required:
        - mandorId
        - fromPlantationId
        - toPlantationId
      properties:
        mandorId:
          type: string
          description: Mandor ID to transfer
          example: "mandor-uuid-456"
        fromPlantationId:
          type: integer
          format: int64
          description: Source plantation ID
          example: 1
        toPlantationId:
          type: integer
          format: int64
          description: Target plantation ID
          example: 2

    ErrorResponse:
      type: object
      description: Standard error response
      properties:
        error:
          type: string
          description: Error type
          example: "Bad Request"
        message:
          type: string
          description: Error message
          example: "Invalid input data"

  responses:
    Unauthorized:
      description: Unauthorized - Invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Unauthorized"
            message: "Authentication required"

    Forbidden:
      description: Forbidden - Insufficient permissions (ADMIN role required)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Forbidden"
            message: "Access denied. ADMIN role required."

    NotFound:
      description: Not Found - Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Not Found"
            message: "Plantation not found with id: 1"

    BadRequest:
      description: Bad Request - Invalid input data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Bad Request"
            message: "Area must be positive"
