spring.application.name=mysawit-plantation-service
server.port=${SERVER_PORT:8082}
server.address=0.0.0.0

# --- Supabase Database Configuration ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.afhfcztdoilrexoicloq}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ / CloudAMQP Configuration
# Single URL drives host/port/user/pass/vhost/SSL — same pattern as shipment service.
# In prod: set CLOUDAMQP_URL secret to amqps://user:pass@host.cloudamqp.com/vhost
# Locally: defaults to a docker-compose RabbitMQ on localhost:5672.
spring.rabbitmq.addresses=${CLOUDAMQP_URL:amqp://guest:guest@localhost:5672/}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Identity Service (internal lookup for user names)
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
identity.service.internal-api-key=${IDENTITY_SERVICE_INTERNAL_KEY:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.readiness.include=readinessState,db

# Tag every metric with the service name so Prometheus/Grafana can filter by it.
# Useful later if you add more microservices to the same Prometheus instance.
management.metrics.tags.application=${spring.application.name}

# Enable %-based histograms for HTTP server requests so you can compute
# p95/p99 latency in Prometheus/Grafana with histogram_quantile().
management.metrics.distribution.percentiles-histogram.http.server.requests=true
