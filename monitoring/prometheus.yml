global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Production CD container (single instance, host networking on 8082)
  - job_name: mysawit-plantation-service
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - host.docker.internal:8082
        labels:
          service: mysawit-plantation-service
          slot: prod

  # Stable LB replicas (port mapping mode)
  - job_name: mysawit-plantation-stable
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - host.docker.internal:8182
          - host.docker.internal:8192
        labels:
          service: mysawit-plantation-service
          slot: stable

  # Canary replica
  - job_name: mysawit-plantation-canary
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - host.docker.internal:8282
        labels:
          service: mysawit-plantation-service
          slot: canary
