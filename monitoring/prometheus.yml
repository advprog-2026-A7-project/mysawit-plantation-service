global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: mysawit-plantation-service
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - host.docker.internal:8082
        labels:
          service: mysawit-plantation-service

  # Uncomment to also scrape the identity-service from this same
  # Prometheus instance (useful when you want one Grafana for both).
  # The identity service runs on host port 8081 by default.
  # - job_name: mysawit-identity-service
  #   metrics_path: /actuator/prometheus
  #   scrape_interval: 10s
  #   static_configs:
  #     - targets:
  #         - host.docker.internal:8081
  #       labels:
  #         service: mysawit-identity-service
